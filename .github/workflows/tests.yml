name: Tests

on:
  pull_request:
    paths:
      - 'plugin.video.redlight/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  push:
    branches: [main]
    paths:
      - 'plugin.video.redlight/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # requests: provided on-device by Kodi's script.module.requests, so addon modules
      # import it freely; the runner needs it installed for those imports to resolve.
      - run: python -m pip install pytest requests
      - run: python -m pytest tests/ -v
